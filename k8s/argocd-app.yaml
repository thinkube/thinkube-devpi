apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devpi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:thinkube/devpi-deployment.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: devpi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  revisionHistoryLimit: 3
