apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devpi-data
  namespace: devpi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devpi
  namespace: devpi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devpi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: devpi
    spec:
      # Add an init container to set proper permissions before main container starts
      initContainers:
      - name: init-permissions
        image: registry.thinkube.com/library/busybox:latest
        command: ['sh', '-c', 'mkdir -p /data/devpi && chmod 700 /data/devpi && touch /data/devpi/secret && chmod 600 /data/devpi/secret && chown -R 1000:1000 /data/devpi']
        volumeMounts:
        - name: data
          mountPath: /data/devpi
        securityContext:
          runAsUser: 0  # Run as root to be able to change permissions
      imagePullSecrets:
      - name: devpi-pull-secret
      containers:
      - name: devpi
        image: devpi-image
        ports:
        - containerPort: 3141
        env:
        - name: DEVPI_OUTSIDE_URL
          value: "https://devpi.thinkube.com"
        - name: DEVPI_TRUSTED_PROXY
          value: "10.0.0.0/8" # This covers the entire private IP range for Kubernetes
        volumeMounts:
        - name: data
          mountPath: /data/devpi
        resources:
          limits:
            memory: 4Gi   # Substantially increased from 1Gi to 4Gi
            cpu: 2000m    # Increased from 1000m to 2000m
          requests:
            memory: 1Gi   # Increased from 512Mi to 1Gi
            cpu: 500m 
        securityContext:
          runAsUser: 1000  # Run as devpi user (UID 1000)
          runAsGroup: 1000
          fsGroup: 1000
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: devpi-data