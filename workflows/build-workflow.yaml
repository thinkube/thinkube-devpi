apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: build-devpi-
  namespace: argo
spec:
  # This ensures all workflow pods run on the master node where SSH keys are properly set up
  nodeSelector:
    kubernetes.io/hostname: gato-p
  
  # Add workflow parameters
  arguments:
    parameters:
    - name: repo-url
      value: git@github.com:thinkube/devpi-deployment.git
    - name: repo-name
      value: devpi-deployment
    - name: repo-org
      value: thinkube
  
  entrypoint: build-and-update-git
  serviceAccountName: kaniko-builder
  # Use the same artifact repository configuration
  artifactRepositoryRef:
    configMap: artifact-repositories
    key: default-v1
  volumes:
  - name: docker-config
    secret:
      secretName: docker-config
  - name: workspace
    emptyDir: {}
  - name: ssh-key
    secret:
      secretName: github-ssh-key-devpi-deployment
      defaultMode: 0600
  templates:
  - name: build-and-update-git
    dag:
      tasks:
      - name: debug-ssh
        template: debug-ssh
        arguments:
          parameters:
          - name: repo-url
            value: "{{workflow.parameters.repo-url}}"
      - name: clone-repo
        template: clone-repo
        dependencies:
        - debug-ssh
        arguments:
          parameters:
          - name: repo-url
            value: "{{workflow.parameters.repo-url}}"
      - name: generate-timestamp
        template: generate-timestamp
        dependencies:
        - clone-repo
      - name: build-image
        template: build-image
        dependencies:
        - clone-repo
        - generate-timestamp
        arguments:
          parameters:
          - name: image-tag
            value: "{{tasks.generate-timestamp.outputs.parameters.timestamp}}"
          artifacts:
          - name: repo
            from: "{{tasks.clone-repo.outputs.artifacts.repo}}"
      - name: update-git
        template: update-git
        dependencies: 
        - build-image
        arguments:
          parameters:
          - name: repo-url
            value: "{{workflow.parameters.repo-url}}"
          - name: repo-org
            value: "{{workflow.parameters.repo-org}}"
          - name: repo-name
            value: "{{workflow.parameters.repo-name}}"
          - name: image-tag
            value: "{{tasks.generate-timestamp.outputs.parameters.timestamp}}"
          artifacts:
          - name: repo
            from: "{{tasks.clone-repo.outputs.artifacts.repo}}"
  
  - name: generate-timestamp
    container:
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          # Generate a timestamp in the format YYYYMMDDTHHmmss
          echo -n $(date +%Y%m%dT%H%M%S) > /tmp/timestamp.txt
          echo "Generated timestamp: $(cat /tmp/timestamp.txt)"
    outputs:
      parameters:
      - name: timestamp
        valueFrom:
          path: /tmp/timestamp.txt
  
  - name: debug-ssh
    inputs:
      parameters:
      - name: repo-url
    container:
      image: alpine:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Installing necessary tools..."
          apk add --no-cache openssh-client git curl
          
          echo "======== SSH KEY DEBUG INFO ========"
          echo "Mounted SSH key directory contents:"
          ls -la /mnt/ssh
          
          echo "Key permissions:"
          stat /mnt/ssh/ssh-privatekey
          
          echo "First line of key file (checking format):"
          head -n 1 /mnt/ssh/ssh-privatekey
          
          echo "Key file line count:"
          cat /mnt/ssh/ssh-privatekey | wc -l
          
          echo "Checking if file is in correct format:"
          if grep -q "BEGIN .* PRIVATE KEY" /mnt/ssh/ssh-privatekey; then
            echo "✅ Key appears to be in correct PEM format"
          else
            echo "❌ Key does NOT appear to be in PEM format"
            echo "Attempting to fix key format..."
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat /mnt/ssh/ssh-privatekey | tr -d '\r' > ~/.ssh/id_ed25519.fixed
            chmod 600 ~/.ssh/id_ed25519.fixed
            
            echo "Fixed key first line:"
            head -n 1 ~/.ssh/id_ed25519.fixed
            
            echo "Fixed key file line count:"
            cat ~/.ssh/id_ed25519.fixed | wc -l
            
            echo "Key fingerprint after fixing:"
            ssh-keygen -l -f ~/.ssh/id_ed25519.fixed || echo "Still failed to analyze key with ssh-keygen"
            
            echo "Testing SSH with fixed key:"
            cp ~/.ssh/id_ed25519.fixed ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
            ssh -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no git@github.com || echo "SSH test still failed"
          fi
          
          echo "Adding known hosts and testing connection:"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          
          echo "Testing connection with original key:"
          cp /mnt/ssh/ssh-privatekey ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no git@github.com || echo "SSH connection test failed"
          
          echo "Testing git ls-remote with repository:"
          git ls-remote {{inputs.parameters.repo-url}} || echo "Git ls-remote failed"
          
          echo "Environment variables:"
          env | grep -i ssh || echo "No SSH environment variables found"
          
          echo "======== END DEBUG INFO ========"
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh
          readOnly: true
          
  - name: clone-repo
    inputs:
      parameters:
      - name: repo-url
    container:
      image: alpine/git:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "Setting up SSH for Git clone..."
          apk add --no-cache openssh-client
          
          # Create proper SSH directory structure
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Copy the SSH key
          cp /mnt/ssh/ssh-privatekey ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Add GitHub to known hosts
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          
          # Display key information for debugging
          echo "Key information:"
          ssh-keygen -l -f ~/.ssh/id_ed25519 || echo "Failed to read key"
          
          # Create workspace directory
          mkdir -p /workspace
          
          # Test SSH connection first
          echo "Testing SSH connection to GitHub..."
          ssh -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no git@github.com || echo "SSH connection test failed"
          
          # Try git clone with verbose output
          echo "Cloning repository: {{inputs.parameters.repo-url}}"
          git clone -v --verbose {{inputs.parameters.repo-url}} /workspace
          
          # Check clone result
          if [ -d "/workspace/.git" ]; then
            echo "✅ Repository cloned successfully"
            ls -la /workspace
            
            # Checkout main branch
            cd /workspace
            git checkout main
            
            # Verify Dockerfile exists
            if [ -f /workspace/dockerfile/Dockerfile ]; then
              echo "✓ Dockerfile found at /workspace/dockerfile/Dockerfile"
            else
              echo "✗ ERROR: Dockerfile not found at expected location"
              find /workspace -name Dockerfile
              exit 1
            fi
          else
            echo "❌ Clone failed - directory doesn't contain Git repository"
            exit 1
          fi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: ssh-key
          mountPath: /mnt/ssh
          readOnly: true
    outputs:
      artifacts:
        - name: repo
          path: /workspace
          
  - name: build-image
    inputs:
      parameters:
      - name: image-tag
      artifacts:
        - name: repo
          path: /workspace
    container:
      image: gcr.io/kaniko-project/executor:latest
      args:
        - --dockerfile=/workspace/dockerfile/Dockerfile
        - --context=/workspace
        - --destination=registry.cmxela.com/thinkube/devpi:{{inputs.parameters.image-tag}}
        - --insecure
        - --insecure-pull
        - --skip-tls-verify
        - --verbosity=debug
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker/
        
  - name: update-git
    inputs:
      parameters:
      - name: repo-url
      - name: repo-org
      - name: repo-name
      - name: image-tag
      artifacts:
        - name: repo
          path: /workspace
    container:
      image: alpine/git:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "Setting up Git configuration..."
          git config --global user.email "ansible@example.com"
          git config --global user.name "Ansible Automation"
          
          # Set up SSH for git push
          echo "Setting up SSH for git push..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cp /mnt/ssh/ssh-privatekey ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          
          # Change to workspace directory
          cd /workspace
          
          echo "Workspace contents:"
          ls -la
          
          echo "Checking for k8s directory:"
          if [ ! -d "k8s" ]; then
            echo "ERROR: k8s directory not found!"
            find . -type d | sort
            exit 1
          fi
          
          echo "k8s directory contents:"
          ls -la k8s/
          
          echo "Checking for kustomization.yaml:"
          if [ ! -f "k8s/kustomization.yaml" ]; then
            echo "ERROR: k8s/kustomization.yaml not found!"
            exit 1
          fi
          
          # Get the image tag from the input parameter
          IMAGE_TAG="{{inputs.parameters.image-tag}}"
          echo "Updating image tag to: $IMAGE_TAG"
          
          # Updated sed command with better matching
          sed -i "s|newTag:.*|newTag: $IMAGE_TAG|" k8s/kustomization.yaml
          
          echo "Updated kustomization.yaml:"
          cat k8s/kustomization.yaml
          
          echo "Committing changes..."
          git add k8s/kustomization.yaml
          git commit -m "Update DevPi image tag to $IMAGE_TAG"
          
          echo "Testing SSH connection to GitHub:"
          export GIT_SSH_COMMAND="ssh -v -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no"
          git ls-remote {{inputs.parameters.repo-url}} || echo "Failed to connect to GitHub"
          
          echo "Pushing changes to GitHub..."
          git push origin HEAD:main
      volumeMounts:
        - name: ssh-key
          mountPath: /mnt/ssh
          readOnly: true